schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: go-doc
      path: api/v3.txt
      packages:
        - .
        - ./adapters/service
        - ./conformance
        - ./migrationsservice
        - ./postgres
operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["./postgres"]
        run: '^Test(OperationGateHonorsCancellationWhileAnotherOperationOwnsSession|BeginOperationHonorsCancellationWhileSessionIsBusy|ReleaseCanceledWhileOperationOwnsGatePreservesSession)$'
        count: 1
        timeout: 2m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: engine-boundary
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzFSSource$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzMigrationIdentity$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzChecksum$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzDecodeLedgerRecord$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
