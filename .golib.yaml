schema_version: 1
tool_version: v1.0.14
tool_checksums_sha256: 88341d2f2904925b22ec8de084fec68c5229669f1119f066ed5fccd76aee2f82
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: go-doc
      path: api/v1.txt
      packages:
        - .
        - ./conformance
        - ./migrationsservice
        - ./postgres
operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: engine-boundary
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzFSSource$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzMigrationIdentity$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzChecksum$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzDecodeLedgerRecord$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
