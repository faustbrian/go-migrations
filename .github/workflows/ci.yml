name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@d38bf31e7403501075442de9fde78f9479052996 # v2.3.0
    with:
      tooling_sha: d38bf31e7403501075442de9fde78f9479052996
      source_bootstrap: false
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}

  engine-boundary:
    name: Engine boundary
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve owned API and ledger boundary
        run: ./scripts/check-engine-boundary.sh

  required:
    name: Required
    if: always()
    needs: [ci, engine-boundary]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          ENGINE_RESULT: ${{ needs.engine-boundary.result }}
        run: test "${CI_RESULT}" = success && test "${ENGINE_RESULT}" = success
