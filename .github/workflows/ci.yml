name: CI

on:
  pull_request:
  push:
    branches: [main, 'chore/identity-*-ci']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@09b43f49385650c44dd4151a12b0877ca6b48a88 # v2.5.1
    with:
      tooling_sha: 09b43f49385650c44dd4151a12b0877ca6b48a88
      source_bootstrap: false
      source_documentation: check
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}

  engine-boundary:
    name: Engine boundary
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve owned API and ledger boundary
        run: ./scripts/check-engine-boundary.sh

  postgres-versions:
    name: PostgreSQL ${{ matrix.postgres }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every supported PostgreSQL major named in docs/compatibility.md.
        postgres: ['14', '15', '16', '17', '18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Integration suite
        env:
          GOWORK: 'off'
          POSTGRES_VERSION: ${{ matrix.postgres }}
        run: go test -tags integration -count=1 -timeout 25m ./postgres
      - name: v4/v5 interoperability
        env:
          GOWORK: 'off'
          POSTGRES_VERSION: ${{ matrix.postgres }}
        run: make -f verification/package.mk interop

  required:
    name: Required
    if: always()
    needs: [ci, engine-boundary, postgres-versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          ENGINE_RESULT: ${{ needs.engine-boundary.result }}
          POSTGRES_RESULT: ${{ needs.postgres-versions.result }}
        run: test "${CI_RESULT}" = success && test "${ENGINE_RESULT}" = success && test "${POSTGRES_RESULT}" = success
